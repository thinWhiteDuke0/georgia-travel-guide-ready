syntax = "proto3";
package places;
option go_package = "georgia-travel-guide/internal/pb/places;placespb";

message Attraction {
  int64  id=1; int64 city_id=2; string name=3; string category=4;
  string description=5; double latitude=6; double longitude=7;
}
message Restaurant {
  int64  id=1; int64 city_id=2; string name=3; string cuisine=4;
  int32  price_level=5; string address=6; double latitude=7; double longitude=8;
}
message Hotel {
  int64  id=1; int64 city_id=2; string name=3; int32 stars=4;
  string address=5; double latitude=6; double longitude=7;
}

message CityIdRequest { int64 city_id = 1; }
message ListAttractionsResponse { repeated Attraction attractions = 1; }
message ListRestaurantsResponse { repeated Restaurant restaurants = 1; }
message ListHotelsResponse      { repeated Hotel      hotels      = 1; }

service PlacesService {
  rpc ListAttractions (CityIdRequest) returns (ListAttractionsResponse);
  rpc ListRestaurants (CityIdRequest) returns (ListRestaurantsResponse);
  rpc ListHotels      (CityIdRequest) returns (ListHotelsResponse);
}
